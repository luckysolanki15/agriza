name: Deploy to Development

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Mock Deploy Step
        run: |
          echo "Pretending to deploy backend..."
          echo "Would run: git pull origin development"
          echo "Would run: npm install"
          echo "Would run: pm2 restart backend-app"

          echo "Pretending to deploy frontend..."
          echo "Would run: npm install"
          echo "Would run: npm run build"
          echo "Would serve the build on port 3000"